<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <script src="https://kit.fontawesome.com/087631af4d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="counter-container">
      <div class="counter">
        <h1>Simple Counter Application</h1>
        <span class="count">0</span>
        <hr />
        <div class="button-group">
          <button class="subtract">
            <i class="fas fa-arrow-down">Subtract</i>
          </button>
          <button class="reset">
            <i class="fas fa-spinner">Reset</i>
          </button>
          <button class="add">
            <i class="fas fa-arrow-up">Add</i>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
